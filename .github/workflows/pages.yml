# StudyNova: one GitHub Pages site with two versions (docs/DEPLOYMENT.md, DECISIONS D5).
#
#   Production  https://bazeocrisy.github.io/StudyNova/          built from main
#   Preview     https://bazeocrisy.github.io/StudyNova/preview/  built from develop
#
# - Pull requests: unit tests, browser tests, allowlist build + verify, browser tests on the built site. Nothing is published.
# - Push to main or develop: test BOTH branches, build each from the allowlist (scripts/build-site.js), test each built
#   site in a browser, then publish them together. If any test fails, nothing is published and the live site stays as it was.
#   The publish job leaves out the ~11-minute layout sweep (run-browser-tests.mjs --quick, HEAVY); every pull request
#   runs it, and production only changes through an approved pull request, so it is not run twice for each publish.
# - Run workflow (manual): rebuilds and republishes both.
# Merging into main still needs the owner's approval of each pull request; this file never merges anything.
name: StudyNova site

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

env:
  CHROME_PATH: /usr/bin/google-chrome

jobs:
  check:
    name: Test, build and verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (hub, privacy, data, workflow, Math)
        run: npm test
      - name: Browser tests (repository)
        run: npm run test:browser
      - name: Build and verify the publishable site (allowlist only)
        run: node scripts/build-site.js _site
      - name: Browser tests (built site, as published)
        run: node scripts/run-browser-tests.mjs --site _site

  build:
    name: Test and build production + preview
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          persist-credentials: false
      - name: Does develop exist yet?
        id: develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/branches/develop" --silent 2>/dev/null; then echo "ref=develop" >> "$GITHUB_OUTPUT"; else echo "ref=main" >> "$GITHUB_OUTPUT"; echo "No develop branch yet: the preview is built from main."; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.develop.outputs.ref }}
          path: develop
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (main)
        working-directory: main
        run: npm test
      - name: Unit tests (develop)
        working-directory: develop
        run: npm test
      - name: Build production from main (allowlist only, verified)
        run: node main/scripts/build-site.js "$GITHUB_WORKSPACE/_site"
      - name: Build preview from develop (allowlist only, verified)
        run: node develop/scripts/build-site.js "$GITHUB_WORKSPACE/_preview"
      - name: Browser tests (production, as published)
        working-directory: main
        run: node scripts/run-browser-tests.mjs --site "$GITHUB_WORKSPACE/_site" --quick
      - name: Browser tests (preview, as published)
        working-directory: develop
        run: node scripts/run-browser-tests.mjs --site "$GITHUB_WORKSPACE/_preview" --quick
      - name: Put the preview under /preview/
        run: |
          mv "$GITHUB_WORKSPACE/_preview" "$GITHUB_WORKSPACE/_site/preview"
          test -f "$GITHUB_WORKSPACE/_site/index.html" && test -f "$GITHUB_WORKSPACE/_site/preview/index.html"
          echo "Publishing $(find "$GITHUB_WORKSPACE/_site" -type f | wc -l) files (production + preview)"
      - name: Upload the site for publishing
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
