name: Verify production Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: legacy
            script: test:browser
          - label: chapter4
            script: test:chapter4:browser
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed source matches main
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = ['js/chapter4.js', 'css/styles.css'];
          for (let attempt = 0; attempt < 60; attempt++) {
            const matches = await Promise.all(files.map(async path => {
              try {
                const response = await fetch('https://bazeocrisy.github.io/Gabriellas-Math-Lab/' + path + '?verify=' + Date.now(), {cache:'no-store'});
                return response.ok && await response.text() === fs.readFileSync(path, 'utf8');
              } catch { return false; }
            }));
            if (matches.every(Boolean)) process.exit(0);
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Pages did not publish the current source within five minutes');
          NODE
      - run: npm run ${{ matrix.script }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
          LIVE_URL: https://bazeocrisy.github.io/Gabriellas-Math-Lab/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-screenshots-${{ matrix.label }}
          path: tests/screenshots/
