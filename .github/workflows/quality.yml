name: NumberNova quality gates
on:
  push:
    branches: [main, feature/chapter-4-textbook]
  pull_request:
    branches: [main]
jobs:
  curriculum-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - if: ${{ !cancelled() }}
        run: npm run test:chapter4:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: tests/screenshots/
